[project]
name = "judgment-search-pilot"
version = "0.1.0"
description = "Local OCR evaluation pipeline for Indian Supreme Court judgments"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.3.5",
    "paddleocr==3.5.0",
    # Paddle 3.3 has unresolved CPU oneDNN/OOM regressions with PaddleOCR 3.x.
    "paddlepaddle==3.2.2",
    "pillow>=11.3.0",
    "pymupdf>=1.28.0",
    "pytesseract>=0.3.13",
    "uvicorn>=0.52.1",
    "wordfreq>=3.1.1",
]

[project.optional-dependencies]
embedding-gpu = [
    "fastembed-gpu>=0.8.0",
    # 1.28 requires CUDA 13; 1.26 matches this machine's CUDA 12 driver.
    "onnxruntime-gpu[cuda,cudnn]==1.26.0",
]

[project.scripts]
judgment-ocr = "judgment_ocr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judgment_ocr"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
    "ruff>=0.12.0",
]

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[tool.uv.sources]
paddlepaddle = { index = "paddle-cpu" }

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
